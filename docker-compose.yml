services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      SECRET_KEY: ${SECRET_KEY:?Copy .env.sample to .env and configure secrets}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-planetarium}
      POSTGRES_USER: ${POSTGRES_USER:-planetarium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - media_data:/vol/web/media
      - static_data:/vol/web/static
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planetarium}
      POSTGRES_USER: ${POSTGRES_USER:-planetarium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  media_data:
  static_data:
