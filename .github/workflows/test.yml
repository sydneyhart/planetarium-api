name: Test
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-long-placeholder-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py test --settings=config.test_settings
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
      - run: ruff check .
      - run: ruff format --check .
      - run: pip check
  docker-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.sample .env
          echo 'INSTALL_DEV=true' >> .env
          docker compose up --build -d
      - run: |
          docker compose run --rm app python manage.py test --settings=config.test_settings
          docker compose run --rm app python manage.py makemigrations --check --dry-run
          docker compose run --rm app python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
          docker compose run --rm app ruff check .
          docker compose run --rm app pip check
          docker compose exec -T app python manage.py seed_demo --with-users
          python3 scripts/smoke_test.py create
          docker compose down
          docker compose up -d
          python3 scripts/smoke_test.py verify
          test "$(docker compose exec -T app id -u)" != '0'
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
